services:
  db:
    image: postgres:18
    container_name: convencendoai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT_HOST}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      args:
        CORPORATE_CA_CERT: ${CORPORATE_CA_CERT}
    container_name: convencendoai_backend
    restart: unless-stopped
    user: "0:0"
    command: >
      sh -c "python manage.py migrate --noinput &&
             { python manage.py seed_llm || echo 'seed_llm falhou; veja o erro acima'; } &&
             uvicorn core.asgi:application --host 0.0.0.0 --port ${BACKEND_PORT} --reload"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT_HOST}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        CORPORATE_CA_CERT: ${CORPORATE_CA_CERT}
    container_name: convencendoai_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT_HOST}:${FRONTEND_PORT}"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
