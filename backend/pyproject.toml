[project]
name = "convencendoai-backend"
version = "0.20.0"
description = "Backend do ConvencendoAI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=6.0,<7.0",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.9",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "uvicorn[standard]>=0.34",
    "uvicorn-worker>=0.3",
    "whitenoise>=6.8",
    "langgraph==1.2.11",
    "langchain==1.3.18",
    "langchain-core>=1.1.0",
    "langchain-openai>=1.3.5",
    "channels>=4.2",
    "djangorestframework-simplejwt>=5.5",
    "drf-spectacular>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "daphne>=4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.dev"
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
